<title>Pinbrawl</title>

<style>
/* Layout: one arcade screen. A 384x288 pixel canvas scaled to fit, with a touch pad under it on phones. Single dark look by design. */
:root {
  color-scheme: dark;
  --void: #07040e;
  --screen: #000000;
  --bezel: #1b1030;
  --bezel-edge: #3c1c8c;
  --glow: rgba(104, 68, 252, 0.28);
  --ink: #fcfcfc;
  --p1: #3cbcfc;
  --gold: #f8b800;
  --pad: #140b26;
  --pad-on: #3c1c8c;
  --font-pixel: "Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-pixel);
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app {
  box-sizing: border-box; height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; padding-inline: 16px; padding-block: 12px;
}
#screen {
  display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: var(--screen);
  border-radius: 4px; touch-action: none; outline: none; max-width: 100%;
  box-shadow: 0 0 0 3px var(--bezel-edge), 0 0 0 9px var(--bezel), 0 0 48px 8px var(--glow);
}
#screen:focus-visible { box-shadow: 0 0 0 3px var(--gold), 0 0 0 9px var(--bezel), 0 0 48px 8px var(--glow); }
#pad { display: none; width: 100%; max-width: 760px; gap: 8px; grid-template-columns: 1.6fr 1fr 1fr 1.6fr; }
body.touch #pad { display: grid; }
#pad button {
  font: inherit; font-size: 11px; letter-spacing: 0.04em; color: var(--ink); background: var(--pad);
  border: 3px solid var(--bezel-edge); border-radius: 8px; padding-block: clamp(18px, 7vh, 60px); padding-inline: 4px;
  touch-action: none; min-width: 0;
}
/* Phones held sideways: flippers go on the left and right of the screen, like a handheld */
body.touch.land #app {
  display: grid; gap: 10px; grid-template-columns: var(--side) auto var(--side);
  grid-template-rows: 1fr 2fr; grid-template-areas: "la cv su" "fl cv fr";
  align-items: stretch; justify-items: stretch; align-content: stretch;
}
body.touch.land #pad { display: contents; }
body.touch.land #screen { grid-area: cv; align-self: center; justify-self: center; }
body.touch.land #pad button { padding-block: 0; }
body.touch.land #pad [data-k="l"] { grid-area: fl; }
body.touch.land #pad [data-k="r"] { grid-area: fr; }
body.touch.land #pad [data-k="launch"] { grid-area: la; }
body.touch.land #pad [data-k="sup"] { grid-area: su; }
#pad button.on { background: var(--pad-on); }
#pad button.fl { color: var(--p1); }
#pad button.sp { color: var(--gold); }
@media (prefers-reduced-motion: reduce) { #screen { box-shadow: 0 0 0 3px var(--bezel-edge), 0 0 0 9px var(--bezel); } }
</style>

<body>

    <button type="button" class="sp" data-k="sup" aria-label="Fire super attack">SUPER</button>
    <button type="button" class="fl" data-k="r" aria-label="Right flipper">FLIP &#9654;</button>

</div>

    if (this.paused) {
      drect(0, 0, SW, SH, K, 10);
      rect(112, 96, 160, 72, K); box(112, 96, 160, 72, YEL);
      textC('PAUSED', 192, 104, YEL, 2);
      textC('P OR ENTER: RESUME', 192, 128, WH); textC('Q: QUIT TO TABLES', 192, 140, G3); textC('M: SOUND ' + (AU.muted ? 'OFF' : 'ON'), 192, 152, G3);
      this.hits.push({ x: 112, y: 96, w: 160, h: 72, fn: () => { this.paused = false; } });
    }
    if (this.state === 'timeup') { drect(0, 100, SW, 44, K, 12); textC('TIME UP!', 192, 108, YEL, 3, K); }
    if (this.state === 'results') this.drawResults();
  }
  drawVS() {
    const k = clamp(this.stT * 3, 0, 1), off = Math.round((1 - k) * 200);
    drect(0, 96, SW, 70, K, 13);
    textC(THEMES[this.sel.p1].name, 84 - off, 104, CYN, 1, K); textC('1P', 84 - off, 116, CYN, 2, K);
    textC(THEMES[this.sel.cpu].name, 300 + off, 104, PC[1].txt, 1, K); textC('CPU', 300 + off, 116, PC[1].txt, 2, K);
    const f = ((this.t * 10) & 1) ? YEL : WH;
    textC('VS', 192, 104 + (1 - k) * 30, f, 4, K);
    textC('GET READY!', 192, 146, WH, 1, K);
  }
  drawHUD() {
    rect(0, 0, SW, HUD, NIGHT); rect(0, HUD - 1, SW, 1, DEEP);
    const p0 = this.pl[0], p1 = this.pl[1]; if (!p0) return;
    text('1P', 3, 1, PC[0].txt); text('×' + p0.mult, 3, 8, p0.mult > 1 ? YEL : G2);
    text(pad7(p0.score), 18, 1, WH, 2);
    text(THEMES[this.sel.p1].short, 106, 1, G2);
    text('CPU', SW - 20, 1, PC[1].txt); text('×' + p1.mult, SW - 14, 8, p1.mult > 1 ? YEL : G2);
    text(pad7(p1.score), SW - 22 - 82, 1, WH, 2);
    text(THEMES[this.sel.cpu].short, 222, 1, G2);
    const lead = p0.score === p1.score ? -1 : p0.score > p1.score ? 0 : 1;
    if (lead === 0) text('★', 106, 8, YEL); else if (lead === 1) text('★', 270, 8, YEL);
    const left = Math.max(0, this.matchT - this.elapsed), m = Math.floor(Math.ceil(left) / 60), s = Math.ceil(left) % 60;
    const ts = m + ':' + String(s).padStart(2, '0');
    textC(ts, 192, 1, left <= 10 && ((this.t * 4) & 1) ? RED : left <= 30 ? YEL : WH, 2);
  }
  drawMiddle() {
    const T = this.t;
    rect(168, HUD, 48, TH, NIGHT);
    for (let y = HUD; y < SH; y += 3) { pset(168, y, DEEP); pset(215, y, DEEP); }
    textC('VS', 192, 19, this.fever && ((T * 6) & 1) ? RED : YEL, 2, K);
    for (let i = 0; i < 2; i++) {
      const p = this.pl[i]; if (!p) continue;
      const x = i ? 203 : 172, y0 = 46, h = 106, full = p.sup >= 100;
      rect(x - 1, y0 - 1, 11, h + 2, K); box(x - 1, y0 - 1, 11, h + 2, full ? YEL : G1);
      const fh = Math.round(h * p.sup / 100);
      for (let y = 0; y < fh; y++) rect(x, y0 + h - 1 - y, 9, 1, full ? ((((T * 10) | 0) + (y >> 2)) & 1 ? WH : YEL) : ((y >> 2) & 1 ? PC[i].body : PC[i].lo));
      textC(i ? 'CPU' : '1P', x + 4, y0 + h + 4, PC[i].txt);
      if (full && ((T * 4) & 1)) textC('GO!', x + 4, 37, YEL);
    }
    text('S', 189, 70, G2); text('U', 189, 80, G2); text('P', 189, 90, G2); text('E', 189, 100, G2); text('R', 189, 110, G2);
    const ey = 170;
    rect(170, ey, 44, 52, K); box(170, ey, 44, 52, this.event ? hex('#00e8d8') : G1);
    if (this.event) {
      const ev = this.event, a = (T * 4) & 1;
      textC('CHAOS!', 192, ey + 4, a ? hex('#00e8d8') : WH);
      textC(ev.l[0], 192, ey + 17, YEL); textC(ev.l[1], 192, ey + 27, YEL);
      if (ev.dur) { const w = Math.round(38 * clamp(this.eventT / ev.dur, 0, 1)); rect(173, ey + 41, 38, 4, G1); rect(173, ey + 41, w, 4, hex('#00e8d8')); }
    } else if (this.state === 'play' || this.state === 'countdown') {
      textC('CHAOS', 192, ey + 6, G2); textC('IN', 192, ey + 18, G2);
      const n = Math.max(0, Math.ceil(this.nextEvent - this.elapsed));
      textC(this.matchT - this.elapsed > 8 + n ? String(n) : '--', 192, ey + 31, WH, 1);
    }
    if (this.fever) { if (((T * 5) & 1)) { textC('FEVER', 192, 228, RED); textC('×2', 192, 237, YEL); } }
    sprC(SPR.ball[0], 178, 256); text('YOU', 186, 253, CYN);
    sprC(SPR.ball[1], 178, 270); text('CPU', 186, 267, PC[1].txt);
  }
  drawBanner() {
    const b = this.banner, k = clamp(b.t * 6, 0, 1), off = Math.round((1 - k) * 260) * (b.dir || 1), out = b.t > b.dur - 0.25;
    if (out && ((b.t * 20) & 1)) return;
    const y = 112;
    drect(0, y - 8, SW, 42, K, 10);
    rect(0, y - 9, SW, 1, b.col); rect(0, y + 33, SW, 1, b.col);
    textC(b.s, 192 + off, y, b.col, tw(b.s, 2) < 370 ? 2 : 1, K);
    if (b.sub) textC(b.sub, 192 - off, y + 21, WH, 1, K);
  }
  drawResults() {
    const r = this.result, p = this.pl, T = this.t;
    drect(0, 0, SW, SH, K, 9);
    const x = 56, y = 34, w = 272, h = 222;
    rect(x, y, w, h, K); box(x, y, w, h, YEL); box(x + 2, y + 2, w - 4, h - 4, DEEP);
    textC('FINAL SCORE', 192, y + 8, G3);
    const head = r.w === 0 ? 'YOU WIN!' : r.w === 1 ? 'CPU WINS!' : 'DRAW!';
    const hc = r.w === 0 ? (((T * 6) & 1) ? CYN : WH) : r.w === 1 ? PC[1].txt : YEL;
    textC(head, 192, y + 22, hc, 3, K);
    const c1 = 124, c2 = 260;
    textC('1P', c1, y + 54, CYN); textC(THEMES[this.sel.p1].name, c1, y + 64, G2); textC(pad7(p[0].score), c1, y + 76, WH, 2);
    textC('CPU', c2, y + 54, PC[1].txt); textC(THEMES[this.sel.cpu].name, c2, y + 64, G2); textC(pad7(p[1].score), c2, y + 76, WH, 2);
    textC('VS', 192, y + 80, G2);
    const stats = [['WARPS SENT', 'warps'], ['SNIPES', 'snipes'], ['SUPERS FIRED', 'supers'], ['DRAINS', 'drains']];
    stats.forEach(([lbl, k], i) => { const yy = y + 104 + i * 12; textC(String(p[0][k]), c1, yy, WH); textC(lbl, 192, yy, G3); textC(String(p[1][k]), c2, yy, WH); });
    const by = y + 168;
    rect(x + 22, by, 104, 20, CYN); box(x + 22, by, 104, 20, WH); textC('REMATCH', x + 74, by + 7, K);
    rect(x + 146, by, 104, 20, G1); box(x + 146, by, 104, 20, G3); textC('NEW TABLES', x + 198, by + 7, WH);
    textC(TOUCH.on ? '' : 'ENTER: REMATCH    ESC: NEW TABLES', 192, by + 30, G2);
    this.hits.push({ x: x + 22, y: by, w: 104, h: 20, fn: () => keyQ.push('Enter') }, { x: x + 146, y: by, w: 104, h: 20, fn: () => keyQ.push('Escape') });
  }
}

/* =========================================================
   SETTINGS (per-viewer convenience only)
   ========================================================= */
let game = null;
function saveSettings() {
  if (!game) return;
  try { localStorage.setItem('pinbrawl-settings', JSON.stringify({ p1: game.sel.p1, level: game.sel.level, time: game.sel.time, muted: AU.muted })); } catch (e) { /* storage unavailable */ }
}
function loadSettings(extra) {
  let s = null;
  try { s = JSON.parse(localStorage.getItem('pinbrawl-settings') || 'null'); } catch (e) { s = null; }
  s = Object.assign({}, s || {}, (extra && extra.settings) || {});
  if (Number.isInteger(s.p1) && s.p1 >= 0 && s.p1 < 4) game.sel.p1 = s.p1;
  if (Number.isInteger(s.level) && s.level >= 0 && s.level < 3) game.sel.level = s.level;
  if (Number.isInteger(s.time) && s.time >= 0 && s.time < 3) game.sel.time = s.time;
  if (typeof s.muted === 'boolean') AU.muted = s.muted;
}

/* =========================================================
   BOOT: input wiring, scaling, main loop
   ========================================================= */
function boot(data) {
  game = new Game();
  loadSettings(data || {});
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ settings: { p1: game.sel.p1, level: game.sel.level, time: game.sel.time, muted: AU.muted } })); } catch (e) { /* optional */ } }

  const wake = () => { AU.init(); if (AU.ctx && AU.ctx.state === 'running') MUS.start(); else if (AU.ctx) AU.ctx.resume().then(() => MUS.start()).catch(() => {}); };
  window.addEventListener('keydown', e => {
    wake();
    const k = KEYS[e.code];
    if (k) press(k, e.code);
    if (!e.repeat) keyQ.push(e.code);
    if (k || ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Slash', 'Backspace'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) release(k, e.code); });
  window.addEventListener('blur', () => { clearHeld(); if (game.state === 'play' && !game.paused) game.paused = true; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { clearHeld(); if (game.state === 'play') game.paused = true; } });

  const toLocal = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * SW, (e.clientY - r.top) / r.height * SH]; };
  const ptr = new Map();
  cv.addEventListener('pointerdown', e => {
    wake(); cv.focus();
    if (e.pointerType === 'touch' && !TOUCH.on) { TOUCH.on = true; document.body.classList.add('touch'); resize(); }
    const [x, y] = toLocal(e);
    if (game.state === 'play' && !game.paused) {
      if (y < HUD) { game.paused = true; clearHeld(); return; }
      const k = x < SW / 2 ? 'l' : 'r'; ptr.set(e.pointerId, k); press(k, 'p' + e.pointerId);
      try { cv.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
      e.preventDefault(); return;
    }
    game.click(x, y);
  });
  const up = e => { const k = ptr.get(e.pointerId); if (k) { release(k, 'p' + e.pointerId); ptr.delete(e.pointerId); } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);
  cv.addEventListener('contextmenu', e => e.preventDefault());

  for (const btn of document.querySelectorAll('#pad button')) {
    const k = btn.dataset.k, src = 'b' + k;
    const on = e => {
      e.preventDefault(); wake(); btn.classList.add('on');
      if (game.state === 'play' && !game.paused) press(k, src);
      else keyQ.push(k === 'l' ? 'TouchLeft' : k === 'r' ? 'TouchRight' : k === 'sup' ? 'TouchUp' : 'TouchOk');
      try { btn.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
    };
    const off = () => { btn.classList.remove('on'); release(k, src); };
    btn.addEventListener('pointerdown', on); btn.addEventListener('pointerup', off); btn.addEventListener('pointercancel', off); btn.addEventListener('lostpointercapture', off);
  }
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches) { TOUCH.on = true; document.body.classList.add('touch'); }

  window.addEventListener('resize', resize);
  resize();
  cv.focus({ preventScroll: true });

  let last = performance.now(), acc = 0;
  const loop = now => {
    let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
    acc += dt; let n = 0;
    while (acc >= STEP && n < 12) { game.tick(STEP); acc -= STEP; n++; }
    if (n >= 12) acc = 0;
    MUS.update();
    game.render();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);

  window.__PB = { game: () => game, DBG, Table, THEMES, EVENTS, AU, SFX, MUS };
}
function resize() {
  const app = document.getElementById('app'), pad = document.getElementById('pad');
  const touch = document.body.classList.contains('touch');
  const land = touch && window.innerWidth > window.innerHeight * 1.15;
  document.body.classList.toggle('land', land);
  let aw, ah;
  if (land) {
    const side = Math.round(clamp(window.innerWidth * 0.15, 84, 150));
    app.style.setProperty('--side', side + 'px');
    aw = app.clientWidth - 32 - 2 * side - 20 - 20; ah = app.clientHeight - 24 - 20;
  } else {
    const ph = touch ? pad.offsetHeight + 14 : 0;
    aw = app.clientWidth - 32 - 20; ah = app.clientHeight - 24 - 20 - ph;
  }
  let s = Math.min(aw / SW, ah / SH);
  const si = Math.floor(s);
  if (si >= 2 && si / s > 0.86) s = si;
  s = Math.max(0.5, s);
  cv.style.width = Math.round(SW * s) + 'px'; cv.style.height = Math.round(SH * s) + 'px';
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
